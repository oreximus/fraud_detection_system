[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-agent-ml"
version = "0.1.0"
description = "ML models for fraud detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "onnxruntime>=1.15",
    "tensorflow>=2.13",
    "tflite-runtime>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"